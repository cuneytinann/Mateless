<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>Mateless arbiter</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="When a flag falls, can the other side still mate? Mateless proves draws by insufficient material, locked positions and short forced lines.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="site">
/* The look both pages share (index.html, chasolver.html): test/build_check.js checks that the two
   copies are the same. */
:root{--ground:#161a21;--raised:#1e232c;--sunk:#12151b;--line:#333a46;--ink:#ebe6da;--dim:#9ba2ae;--faint:#6f7682;
  --draw:#5bb5a4;--win:#d9a347;--flag:#e5484d;--open:#8a8f99;--focus:#8ab4f8;--sq-d:#7d8a99;--sq-l:#c9d1da;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font:15.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 90px}
a{color:var(--ink);text-decoration-color:var(--faint);text-underline-offset:3px}
a:hover{text-decoration-color:var(--ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hide{display:none!important}
code,.mono{font-family:var(--mono);font-size:.9em}
p{max-width:72ch}
h1{font:600 clamp(28px,4vw,40px)/1.15 var(--cond);letter-spacing:-.005em;margin:0 0 12px;max-width:24ch}
h2{font:600 22px/1.3 var(--cond);margin:56px 0 14px}
h3{font:600 16px/1.4 var(--sans);margin:26px 0 8px}
.lede{font-size:17px;color:var(--ink);margin:0 0 10px;max-width:66ch}
.dim{color:var(--dim)}
.small{font-size:13.5px}

/* the bar the two pages share */
.bar-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px;padding:18px 0 16px;margin-bottom:40px;border-bottom:1px solid var(--line)}
.brand{font:600 22px/1 var(--cond);letter-spacing:.01em;text-decoration:none;color:var(--ink)}
.brand i{font-style:normal;color:var(--flag)}
.tabs{display:flex;gap:4px;flex:1}
.tabs a{padding:7px 12px;border-radius:5px;text-decoration:none;color:var(--dim);font-weight:500}
.tabs a:hover{color:var(--ink);background:var(--raised)}
.tabs a[aria-current=page]{color:var(--ink);background:var(--raised);box-shadow:inset 0 -2px 0 var(--ink)}
.bar-top .end{display:flex;gap:16px;align-items:center;font-size:14px}
.bar-top .end a{color:var(--dim)}

/* forms */
select,input[type=number],textarea{background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:5px;font:13.5px var(--mono)}
select{padding:5px 8px;font-family:var(--sans);font-size:14px}
input[type=number]{width:92px;padding:5px 8px}
textarea{width:100%;min-height:128px;padding:10px 12px;line-height:1.6;resize:vertical}
textarea::placeholder{color:var(--faint)}
select:hover,input[type=number]:hover,textarea:hover{border-color:#4a5262}
input[type=checkbox],input[type=radio]{width:16px;height:16px;margin:0;accent-color:var(--ink)}
select[disabled],input[disabled],textarea[disabled]{opacity:.5}
button{font:500 14px var(--sans);padding:8px 16px;border-radius:5px;border:1px solid var(--line);background:var(--raised);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--dim)}
button[disabled]{opacity:.4;cursor:default}
button.primary{background:var(--ink);color:var(--ground);border-color:var(--ink);font-size:15px;padding:11px 24px}
button.primary:hover{background:#fff}
button.primary.stop{background:var(--flag);border-color:var(--flag);color:#fff}
button.link{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px;font-size:inherit;font-weight:400}
a.btn{display:inline-block;padding:7px 14px;border:1px solid var(--line);border-radius:5px;text-decoration:none;font-size:14px;font-weight:500}
a.btn:hover{border-color:var(--dim)}

/* input panel */
.panel{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:22px 22px 18px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:start}
@media(max-width:780px){.two{grid-template-columns:1fr}}
.lab{display:block;font-weight:600;margin:0 0 8px}
.hint{font-size:13.5px;color:var(--dim);margin:8px 0 0}
.drop{border:1.5px dashed #4a5262;border-radius:8px;background:var(--sunk);padding:22px 18px;text-align:center;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--draw)}
.drop.off{opacity:.5;cursor:default}
.drop strong{display:block;font-weight:500;margin-bottom:6px}
.drop small{display:block;font-size:13px;color:var(--dim)}
.flist{list-style:none;margin:10px 0 0;padding:0;font-size:13.5px}
.flist li{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.flist .fname{font-family:var(--mono);font-size:13px;word-break:break-all}
.flist .fmeta{color:var(--dim)}
.flist .fref{margin-left:auto;color:var(--dim)}
.flist .fref label{display:flex;gap:6px;align-items:center}
.flist .clr{border:0;justify-content:flex-end}
.flist .x{border:0;background:transparent;font-size:18px;line-height:1;padding:2px 6px}
.flist .x:hover{color:var(--flag)}
.opts{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:center;margin:16px 0 0;font-size:14.5px}
.opts label,.opts .rng{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gorow{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:20px}
.stat{font-size:14px;max-width:80ch}
.prog{height:3px;background:var(--sunk);margin:14px 0 0;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}

/* boards */
.bd{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;aspect-ratio:1;border-radius:3px;overflow:hidden}
.bd i{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;font-style:normal;line-height:1;
  font-size:15px;font-family:"Segoe UI Symbol","Apple Symbols","DejaVu Sans",serif;font-variant-emoji:text}
.bd i.d{background:var(--sq-d)} .bd i.l{background:var(--sq-l)}
.bd i.w{color:#fff;text-shadow:0 0 1px #000,0 0 1px #000,0 0 1px #000,0 0 2px #000}
.bd i.b{color:#111}
.bd.big i{font-size:clamp(24px,7.4vw,38px)}
@media(min-width:861px){.bd.big i{font-size:36px}}
.bd s{position:absolute;text-decoration:none;font:500 10px/1 var(--mono);color:#1e232c;opacity:.75;text-shadow:none}
.bd i.d s{color:#eef1f4}
.bd s.rk{top:3px;left:3px} .bd s.fl{bottom:2px;right:3px}

/* tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:6px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:7px 12px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:500;font-size:13px}
th:first-child,td:first-child,.lf{text-align:left}
tr.tot td{border-top:1px solid var(--dim);font-weight:600}
dl.kv{display:grid;grid-template-columns:minmax(150px,max-content) 1fr;gap:4px 18px;margin:0;font-size:14.5px}
dl.kv dt{color:var(--dim)} dl.kv dd{margin:0}
.fenbox{font:12.5px/1.5 var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:9px 11px;word-break:break-all;margin:12px 0 10px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.pg{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:18px;font-size:13.5px;flex-wrap:wrap}

/* the verdict as a chess score */
.score{font:600 56px/1 var(--cond);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:3px 11px;border-radius:999px;border:1px solid currentColor;font-size:13px;font-weight:500;white-space:nowrap}
.k-draw{color:var(--draw)} .k-win{color:var(--win)} .k-open{color:var(--open)} .k-bad{color:var(--faint)} .k-flag{color:var(--flag)}

footer{margin-top:72px;padding-top:16px;border-top:1px solid var(--line);font-size:13.5px;color:var(--dim)}
footer p{max-width:100ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
/* the arbiter page */
.speed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:28px 0 36px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.speed div{padding:16px 18px 16px 0}
.speed div+div{padding-left:18px;border-left:1px solid var(--line)}
.speed b{display:block;font:600 30px/1.1 var(--cond);font-variant-numeric:tabular-nums}
.speed span{display:block;font-size:13.5px;color:var(--dim);margin-top:4px;max-width:34ch}
@media(max-width:780px){.speed{grid-template-columns:1fr}.speed div+div{padding-left:0;border-left:0;border-top:1px solid var(--line)}}
.flagnote{margin:18px 0 0;padding:12px 16px;border-left:3px solid var(--flag);background:var(--sunk);border-radius:0 6px 6px 0;font-size:14.5px}
.flagnote b{font-weight:600}
.flagnote p{margin:4px 0 0;max-width:86ch}

/* outcome */
.obar{display:flex;height:12px;margin:10px 0 18px;border-radius:3px;overflow:hidden;background:var(--sunk)}
.obar span{display:block;min-width:3px}
.r-material{background:#3f8f82} .r-lock{background:var(--draw)} .r-domino{background:#9bd8cb} .r-stalemate{background:#2c645b}
.r-mate{background:var(--win)} .r-open{background:repeating-linear-gradient(135deg,#6f7682 0 4px,#4a505b 4px 7px)} .r-bad{background:#3a404b}
.okey{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px 26px;margin:0}
.ok1{display:grid;grid-template-columns:12px 1fr;gap:4px 10px;align-items:baseline}
.ok1 .sw{width:12px;height:12px;border-radius:2px;align-self:center}
.ok1 b{font:600 24px/1.1 var(--cond);font-variant-numeric:tabular-nums}
.ok1 .ol{grid-column:2;font-size:14.5px}
.ok1 p{grid-column:2;margin:0;font-size:13px;color:var(--dim)}
.group{font-size:13.5px;color:var(--dim);margin:22px 0 10px}
.note{border-left:3px solid var(--line);padding:4px 0 4px 14px;margin:14px 0;font-size:14.5px;max-width:86ch}
.note.good{border-color:var(--draw)} .note.bad{border-color:var(--flag)} .note.warn{border-color:var(--win)}

/* reference matrix */
.mx{table-layout:fixed;min-width:600px}
.mx th{vertical-align:bottom;text-align:center}
.mx th small{display:block;font-size:12.5px;color:var(--faint);font-weight:400}
.mx th.lf{text-align:left;vertical-align:middle;color:var(--ink);font-size:14px}
.mx td{text-align:center;padding:14px 8px;border:3px solid var(--ground);border-radius:6px}
.mx td b{display:block;font:600 26px/1.1 var(--cond)}
.mx td span{font-size:12.5px}
.c-ok{background:#1f3a35} .c-okd{background:#1d2d2b} .c-miss{background:#3a3220} .c-false{background:#5a1f22} .c-contra{background:#4a2a20}
.mx td.zero{background:transparent;color:var(--faint);outline:1px dashed var(--line);outline-offset:-4px}
td.badn{color:var(--flag);font-weight:600}

/* browse */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:14px;margin-top:14px}
.card{display:block;padding:0 0 8px;border:0;border-radius:6px;background:var(--raised);text-align:left;font:inherit;color:inherit;cursor:zoom-in;overflow:hidden}
.card:hover{background:#262c37}
.card .bd{border-radius:0}
.card .ct{display:flex;align-items:baseline;gap:8px;padding:8px 9px 0}
.card .cs{font:600 19px/1 var(--cond)}
.card .cr{font-size:12.5px}
.card .cm{display:block;padding:3px 9px 0;font:11px/1.45 var(--mono);color:var(--dim);word-break:break-all}
.card .cm em{font-style:normal;color:var(--flag)}
.card.ref-false{box-shadow:inset 0 0 0 2px var(--flag)} .card.ref-contra{box-shadow:inset 0 0 0 2px #d0743c}
.bd i.fk{box-shadow:inset 0 0 0 3px var(--flag)}
.bd.big i.fk{box-shadow:inset 0 0 0 4px var(--flag)}

/* detail */
#solo{margin-top:34px}
.detail{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:34px;align-items:start}
@media(max-width:860px){.detail{grid-template-columns:1fr}.dboard{max-width:400px}}
.dboard .cap{font-size:13.5px;color:var(--dim);margin:8px 0 0}
.dboard .cap b{color:var(--flag);font-weight:500}
.vhead{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.vword{font:600 22px/1.2 var(--cond)}
.vtext{font-size:16px;margin:12px 0 0;max-width:62ch}
.steps{list-style:none;counter-reset:st;padding:0;margin:10px 0 0}
.steps li{counter-increment:st;position:relative;padding:8px 12px 9px 44px;margin:0 0 6px;border-radius:6px;background:var(--raised)}
.steps li::before{content:counter(st);position:absolute;left:14px;top:9px;font:600 15px/1.3 var(--cond);color:var(--dim)}
.steps .sh{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.steps .sh b{font-weight:600}
.steps .sh code{color:var(--dim);font-size:12.5px}
.steps p{margin:3px 0 0;font-size:14.5px}
.stag{margin-left:auto;font-size:12.5px;color:var(--dim)}
.st-dec{box-shadow:inset 3px 0 0 var(--draw)} .st-dec .stag{color:var(--draw)}
.st-win{box-shadow:inset 3px 0 0 var(--win)} .st-win .stag{color:var(--win)}
.st-open{box-shadow:inset 3px 0 0 var(--open)}
.st-skip,.st-also{opacity:.62}
dd.ref-false{color:var(--flag);font-weight:600}
h4{font:600 15px/1.4 var(--sans);margin:26px 0 8px}

/* dialog */
.lb{position:fixed;inset:0;background:rgba(8,10,14,.78);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:3vh 14px;overflow-y:auto}
.lbin{background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:0 24px 26px;max-width:1080px;width:100%}
.lbbar{display:flex;gap:10px;align-items:center;position:sticky;top:0;background:var(--ground);padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:20px;z-index:1}
.lbbar #lbpos{font-size:13.5px;color:var(--dim)}
.lbbar #lbx{margin-left:auto}

/* games */
.pdet{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:flex-start;margin-top:14px}
.pdet>.bd{flex:0 0 auto;width:min(360px,100%)}
.pdet>div:last-child{flex:1 1 320px;min-width:0}
#pgntab td{white-space:nowrap}
#pgntab td:nth-child(2),#pgntab td:nth-child(3),#pgntab td:last-child,#pgntab th:nth-child(2),#pgntab th:nth-child(3),#pgntab th:last-child{text-align:left}
#pgntab td:last-child{white-space:normal}
#pgntab tr[data-pk]{cursor:pointer}
#pgntab tr[data-pk]:hover td{background:var(--raised)}
#pgntab tr.act td{background:var(--raised)}
#pgntab tr.pc-lateDP td:last-child,#pgntab tr.pc-lateRule td:last-child,#pgntab tr.pc-wrongtm td:last-child,#pgntab tr.pc-wrongres td:last-child{color:var(--flag)}
#pgntab tr.pc-ok td:last-child{color:var(--draw)}
#pgntab tr.pc-illegal td:last-child,#pgntab tr.pc-unread td:last-child{color:var(--faint)}
#pgnsum table{width:auto;margin:6px 0 8px}
.mvs{font:13.5px/2 var(--mono);max-width:100ch}
.mvs .n{color:var(--faint);margin-right:2px}
.mvs .e{background:#3a3220;color:var(--win);padding:1px 5px;border-radius:3px}
.mvs .a{color:var(--faint);text-decoration:line-through}
.mvs .x{color:var(--flag);font-weight:600;text-decoration:underline}

/* the engine */
details.fold{margin:56px 0 0;border-top:1px solid var(--line);padding-top:14px}
details.fold>summary{cursor:pointer;font:600 18px/1.4 var(--cond);list-style:none;display:flex;gap:10px;align-items:baseline}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"+";color:var(--dim);font-family:var(--mono);font-weight:400}
details.fold[open]>summary::before{content:"−"}
.src{font:11.5px/1.6 var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:12px 14px;white-space:pre;overflow:auto;max-height:75vh;margin:10px 0 0;tab-size:2;color:#cfd4dc}
</style>
<body>
<div class="wrap">
<header class="bar-top">
  <a class="brand" href="index.html">Mateless</a>
  <nav class="tabs" aria-label="pages">
    <a href="index.html" aria-current="page" data-i="navArb">Arbiter</a>
    <a href="chasolver.html" data-i="navCha">chasolver</a>
  </nav>
  <div class="end">
    <label><span class="dim" data-i="lblLang">Language</span>
      <select id="lang"><option value="en">English</option><option value="tr">Türkçe</option></select></label>
    <a href="https://github.com/cuneytinann/Mateless">GitHub</a>
  </div>
</header>

<h1 data-i="h1">When a flag falls, can the other side still mate?</h1>
<p class="lede" data-ihtml data-i="lede"></p>
<div class="speed">
  <div><b data-i="sp1n">~90 ns</b><span data-i="sp1t"></span></div>
  <div><b data-i="sp2n">~70×</b><span data-i="sp2t"></span></div>
  <div><b data-i="sp3n">99.98%</b><span data-i="sp3t"></span></div>
</div>

<section class="panel" aria-labelledby="poslab">
  <div class="two">
    <div>
      <label class="lab" id="poslab" for="fen" data-i="hPos">Positions</label>
      <textarea id="fen" rows="5" spellcheck="false" autocomplete="off" aria-describedby="poshint" placeholder="5b2/p7/Pp3k2/1Pp1pBp1/2P1P1P1/5K2/8/8 w - -"></textarea>
      <p class="hint" id="poshint"><span data-ihtml data-i="posHint"></span> <button class="link" id="example" data-i="useEx"></button></p>
    </div>
    <div>
      <span class="lab" data-i="hFiles">Files</span>
      <div class="drop" id="drop" tabindex="0" role="button">
        <strong data-i="dropBig"></strong>
        <small data-ihtml data-i="dropSmall"></small>
      </div>
      <input type="file" id="file" accept=".csv,.txt,text/csv,text/plain" multiple class="hide">
      <ul class="flist" id="flist"></ul>
      <p class="hint" data-ihtml data-i="dataHint"></p>
    </div>
  </div>

  <div class="flagnote" role="note">
    <b data-i="assumeH"></b>
    <p data-ihtml data-i="assume"></p>
    <p class="hide" id="assumeBoth" data-i="assumeBoth"></p>
  </div>

  <div class="opts">
    <label><span data-i="lblPly">ply ceiling</span> <input type="number" id="ply" value="6" min="1" max="600"></label>
    <label><span data-i="lblBud">node budget</span> <input type="number" id="bud" value="100" min="1" step="10"></label>
    <span class="dim small" id="limnote"></span>
  </div>
  <div class="opts">
    <span class="rng"><label for="rowA" data-i="lblRange">positions</label> <input type="number" id="rowA" value="1" min="1" step="100">
      <label for="rowB" data-i="lblRangeTo">to</label> <input type="number" id="rowB" value="0" min="0" step="100">
      <span class="dim small" data-i="lblRangeNote"></span></span>
  </div>
  <div class="opts hide" id="labrow">
    <span data-i="lblLab">labels</span> <span id="labs" class="opts" style="margin:0"></span>
    <label><input type="checkbox" id="bothdir"> <span data-i="lblBoth">judge both flags</span></label>
  </div>
  <div class="gorow">
    <button id="go" class="primary"></button>
    <span class="dim small" id="split"></span>
    <span class="stat" id="stat" aria-live="polite"></span>
  </div>
  <div class="prog hide" id="bar"><i id="barf"></i></div>
</section>

<section id="solo" class="hide"></section>

<section id="out" class="hide">
  <h2 data-i="secResults"></h2>
  <div id="outcome"></div>

  <h2 data-i="secRef"></h2>
  <div id="refbox"></div>

  <h2 data-i="secPer"></h2>
  <div class="scroll"><table id="perfile"></table></div>

  <h2 data-i="secCost"></h2>
  <div class="scroll"><table id="cost"></table></div>
  <p class="dim small" data-i="costNote"></p>

  <h2 data-i="secBrowse"></h2>
  <p class="dim small" data-i="browseNote"></p>
  <div class="opts" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div class="pg" id="pg"></div>

// 3. Castling files
// ═══════════════════════════════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════════════════════════════
// 4. Position
// ═══════════════════════════════════════════════════════════════════════════════════════

// 5. Attacks
// ═══════════════════════════════════════════════════════════════════════════════════════
