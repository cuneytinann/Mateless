[package]
name = "mateless"
version = "0.1.0"
edition = "2021"
authors = ["Cüneyt İnan"]
repository = "https://github.com/cuneytinann/Mateless"
description = "Mateless: static lock detector and Domino search for FIDE dead positions and flag falls (Rust port of mateless.js)"
license = "MIT"

[lib]
name = "mateless"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
# Only for the examples that run chasolver: vs_chasolver.rs (speed) and oracle.rs (full analysis).
# chasolver's main (cb1e9da) plus our stalemate-filter fix, miguel-ambrona/chasolver#51, not yet
# merged: the same chasolver as the site's chasolver tab.
chasolver = { git = "https://github.com/cuneytinann/chasolver", rev = "ec0d899c5ae507327fce40a7f9488373954b9b30" }
chess = "3.2"

[profile.release]
lto = true
codegen-units = 1
