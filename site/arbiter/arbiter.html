<h1 data-i="h1">When a flag falls, can the other side still mate?</h1>
<p class="lede" data-ihtml data-i="lede"></p>
<div class="speed">
  <div><b data-i="sp1n">~90 ns</b><span data-i="sp1t"></span></div>
  <div><b data-i="sp2n">~17–18×</b><span data-i="sp2t"></span></div>
  <div><b data-i="sp3n">99.98%</b><span data-i="sp3t"></span></div>
</div>

<details class="fold why" id="fold-why">
  <summary data-i="whyH">Why it matters: the proposed model</summary>
  <div class="whyb" data-ihtml data-i="whyBody"></div>
</details>

<section class="panel ed" id="ed" aria-labelledby="edlab">
  <h2 class="edh" id="edlab" data-i="edH">Set up a position</h2>
  <p class="hint edsub" data-i="edSub"></p>
  <div class="edgrid">
    <div class="edleft">
      <div class="pal" id="palTop" role="toolbar"></div>
      <div class="vbar" id="vbarTop" aria-live="polite"></div>
      <div class="bd big ebd" id="ebd" role="img"></div>
      <div class="vbar" id="vbarBot" aria-live="polite"></div>
      <div class="pal" id="palBot" role="toolbar"></div>
      <p class="sdsum" id="edSum"></p>
      <div id="edInfo"></div>
    </div>
    <div class="edside">
      <div class="edrow"><span class="lab" data-i="edTurn">Turn</span>
        <div class="seg" id="edTurn"><button data-v="w" data-i="white">White</button><button data-v="b" data-i="black">Black</button></div></div>
      <div class="edrow"><span class="lab" data-i="edCastle">Castling</span>
        <div class="seg" id="edCastle"><button data-v="K">K</button><button data-v="Q">Q</button><button data-v="k">k</button><button data-v="q">q</button></div></div>
      <div class="edrow"><span class="lab" data-i="edEp">En passant</span>
        <div class="seg" id="edEp"></div></div>
      <div class="edrow"><label class="lab" for="edClock" data-i="edClock">Halfmove clock</label>
        <div class="seg"><input type="number" id="edClock" min="0" max="9999" value="0"><span class="dim small" id="edClockNote"></span></div></div>
      <div class="edrow"><span class="lab" data-i="edPre">Presets</span>
        <div class="seg"><button id="edStart" data-i="edStart">Start</button><button id="edClear" data-i="edClear">Clear</button><button id="edEx" data-i="edEx">Example</button><button id="edFlip" data-i="edFlip">Flip</button></div></div>
      <div class="edrow"><label class="lab" for="edFen">FEN</label>
        <div class="fenrow"><input type="text" id="edFen" spellcheck="false" autocomplete="off"><button id="edCopy" data-i="edCopy">Copy</button><button id="edPaste" data-i="edPaste">Paste</button></div>
        <p class="hint hide" id="edBad"></p></div>
      <div class="edrow edgo"><button class="primary" id="edGo" data-i="edGo">How it was decided</button><button id="edAdd" data-i="edAdd">Add to the positions below</button></div>
      <p class="hint" data-ihtml data-i="edHint"></p>
      <div class="edeng" aria-labelledby="englab">
        <span class="lab" id="englab" data-i="engH">The engine</span>
        <div class="engrow">
          <select id="ver" aria-label="version">
            <option value="2" data-i="ver2" selected>full (the second version)</option>
            <option value="1" data-i="ver1">fast (the first version)</option>
          </select>
          <label class="chk"><input type="checkbox" id="lockonly"> <span data-i="lblLockOnly">lock detector only</span></label>
        </div>
        <p class="hint" id="vernote"></p>
        <div class="engrow">
          <label class="chk"><input type="checkbox" id="c960"> <span data-i="lbl960">Chess960</span></label>
          <label class="hide" id="c960idl"><span data-i="lbl960id">start position</span> <input type="number" id="c960id" value="518" min="0" max="959" step="1" inputmode="numeric"></label>
          <code class="dim hide" id="c960arr"></code>
        </div>
        <p class="hint hide" id="c960note" data-i="c960Note"></p>
        <div id="rulerow">
          <fieldset class="mrule"><legend class="lab" data-i="lblRule">move rule</legend>
            <label><input type="radio" name="mrule" value="150" checked> <span data-i="rule75">75 moves (recommended, closer to FIDE)</span></label>
            <label><input type="radio" name="mrule" value="100"> <span data-i="rule50">50 moves (the upper limit preferred online)</span></label>
          </fieldset>
          <fieldset class="mrule"><legend class="lab" data-i="lblRep">repetition</legend>
            <label><input type="radio" name="mrep" value="5" checked> <span data-i="rep5">fivefold (recommended, FIDE)</span></label>
            <label><input type="radio" name="mrep" value="3"> <span data-i="rep3">threefold (preferred online)</span></label>
          </fieldset>
          <p class="hint" data-i="ruleNote"></p>
        </div>
        <div id="gatebox">
          <div class="gatehead hide" id="gatehead" aria-hidden="true"><span></span><span data-i="lblPlies">plies</span><span data-i="lblNodes">nodes</span></div>
          <div class="engrow gaterow"><span class="gatelab hide" id="g1lab" data-i="lblGate1">gate 1</span>
            <label><span class="glab" data-i="lblPly">ply ceiling</span> <input type="number" id="ply" value="3" min="1" max="1500" step="1" inputmode="numeric"></label>
            <label><span class="glab" data-i="lblBud">node budget</span> <input type="number" id="bud" value="10" min="1" max="1000000000" step="1" inputmode="numeric"></label>
          </div>
          <div id="gaterows" class="hide">
            <div class="engrow gaterow"><span class="gatelab" data-i="lblGate2">gate 2</span>
              <label><span class="glab" data-i="lblPly">ply ceiling</span> <input type="number" id="g2p" value="9" min="1" max="1500" step="1" inputmode="numeric"></label>
              <label><span class="glab" data-i="lblBud">node budget</span> <input type="number" id="g2b" value="5000" min="1" max="1000000000" step="1" inputmode="numeric"></label>
            </div>
            <div class="engrow gaterow"><label class="gatelab"><input type="checkbox" id="g3on"> <span data-i="lblGate3">gate 3 (analysis)</span></label>
              <label><span class="glab" data-i="lblPly">ply ceiling</span> <input type="number" id="g3p" disabled value="150" min="1" max="1500" step="1" inputmode="numeric"></label>
              <label><span class="glab" data-i="lblBud">node budget</span> <input type="number" id="g3b" disabled value="5000000" min="1" max="1000000000" step="1" inputmode="numeric"></label>
            </div>
          </div>
        </div>
        <p class="hint" id="limnote"></p>
      </div>
    </div>
  </div>
</section>

<section class="panel" aria-labelledby="poslab">
  <div class="two">
    <div>
      <label class="lab" id="poslab" for="fen" data-i="hPos">Positions</label>
      <textarea id="fen" rows="5" spellcheck="false" autocomplete="off" aria-describedby="poshint" placeholder="5b2/p7/Pp3k2/1Pp1pBp1/2P1P1P1/5K2/8/8 w - -"></textarea>
      <p class="hint" id="poshint"><span data-ihtml data-i="posHint"></span> <button class="link" id="example" data-i="useEx"></button></p>
    </div>
    <div>
      <span class="lab" data-i="hFiles">Files</span>
      <div class="drop" id="drop" tabindex="0" role="button">
        <strong data-i="dropBig"></strong>
        <small data-ihtml data-i="dropSmall"></small>
      </div>
      <input type="file" id="file" accept=".csv,.txt,text/csv,text/plain" multiple class="hide">
      <ul class="flist" id="flist"></ul>
      <p class="hint" data-ihtml data-i="dataHint"></p>
    </div>
  </div>

  <div class="flagnote" role="note">
    <b data-i="assumeH"></b>
    <p data-ihtml data-i="assume"></p>
    <p class="hide" id="assumeBoth" data-i="assumeBoth"></p>
  </div>

  <div class="opts">
    <span class="rng"><label for="rowA" data-i="lblRange">positions</label> <input type="number" id="rowA" value="1" min="1" step="100">
      <label for="rowB" data-i="lblRangeTo">to</label> <input type="number" id="rowB" value="0" min="0" step="100">
      <span class="dim small" data-i="lblRangeNote"></span></span>
  </div>
  <div class="opts hide" id="labrow">
    <span data-i="lblLab">labels</span> <span id="labs" class="opts" style="margin:0"></span>
    <label><input type="checkbox" id="bothdir"> <span data-i="lblBoth">judge both flags</span></label>
  </div>
  <div class="gorow">
    <button id="go" class="primary"></button>
    <span class="dim small" id="split"></span>
    <span class="stat" id="stat" aria-live="polite"></span>
  </div>
  <div class="prog hide" id="bar"><i id="barf"></i></div>
</section>

<section id="solo" class="hide"></section>

<section id="out" class="hide">
  <h2 data-i="secResults"></h2>
  <div id="outcome"></div>

  <h2 data-i="secRef"></h2>
  <div id="refbox"></div>

  <h2 data-i="secPer"></h2>
  <div class="scroll"><table id="perfile"></table></div>

  <h2 data-i="secCost"></h2>
  <div class="scroll"><table id="cost"></table></div>
  <p class="dim small" data-i="costNote"></p>

  <h2 data-i="secBrowse"></h2>
  <p class="dim small" data-i="browseNote"></p>
  <div class="opts" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div class="pg" id="pg"></div>

  <h2 data-i="secExp"></h2>
  <div class="opts">
    <button id="expAll" data-i="expAll"></button>
    <button id="expUn" data-i="expUn"></button>
    <button id="expMate" data-i="expMate"></button>
    <button id="expMiss" data-i="expMiss"></button>
    <button id="expBad" data-i="expBad"></button>
    <button id="expInv" data-i="expInv"></button>
  </div>
  <p class="dim small" data-ihtml data-i="expNote"></p>
</section>

<section id="pgnsec">
  <h2 data-i="secPgn"></h2>
  <p data-ihtml data-i="pgnSub"></p>
  <div class="panel">
    <div class="two">
      <div>
        <label class="lab" for="pgntext" data-i="pgnHPaste"></label>
        <textarea id="pgntext" rows="5" spellcheck="false" autocomplete="off" placeholder='[Result "0-1"]&#10;1. f3 e5 2. g4 Qh4# 0-1'></textarea>
      </div>
      <div>
        <span class="lab" data-i="hFiles"></span>
        <div class="drop" id="pdrop" tabindex="0" role="button">
          <strong data-i="pgnDropBig"></strong>
          <small data-ihtml data-i="pgnDropSmall"></small>
        </div>
        <input type="file" id="pfile" accept=".pgn,application/x-chess-pgn,text/plain" multiple class="hide">
        <ul class="flist" id="pgnflist"></ul>
      </div>
    </div>
    <div class="gorow">
      <button id="pgngo" class="primary"></button>
      <span class="stat" id="pstat" aria-live="polite"></span>
    </div>
    <div class="prog hide" id="pbar"><i id="pbarf"></i></div>
  </div>
  <div id="pgnout" class="hide">
    <div class="scroll" id="pgnsum"></div>
    <div class="opts"><label><span data-i="pgnFilt"></span> <select id="pgnfilt"></select></label>
      <button id="pgnexp" data-i="pgnExp"></button></div>
    <div class="scroll"><table id="pgntab"></table></div>
    <div class="pg" id="pgnpg"></div>
    <div id="pgndet"></div>
  </div>
</section>

<details class="fold" id="fold-engine">
  <summary data-i="secEngine"></summary>
  <p class="dim small" data-ihtml data-i="engineNote"></p>
  <pre class="src" id="srcbox"></pre>
</details>

<footer data-ihtml data-i="foot"></footer>

<div id="lb" class="lb hide">
  <div class="lbin" role="dialog" aria-modal="true" aria-labelledby="lbpos">
    <div class="lbbar">
      <button id="lbprev" data-i="lbPrev"></button>
      <span id="lbpos"></span>
      <button id="lbnext" data-i="lbNext"></button>
      <button id="lbx" data-i="lbClose"></button>
    </div>
    <div id="lbbody"></div>
  </div>
</div>
